<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
    }

    h1 {
        color: #27ae60;
    }

    /* Sidebar */
    .sidebar {
        width: 200px;
        background: #2c3e50;
        color: white;
        height: 100vh;
        padding-top: 20px;
    }

    .sidebar h2 {
        text-align: center;
    }

    .sidebar a {
        display: block;
        color: white;
        padding: 12px;
        text-decoration: none;
    }

    .sidebar a:hover {
        background: #34495e;
    }

    /* Main Content */
    .main {
        flex: 1;
        background: #f4f6f9;
    }

    /* Header */
    .header {
        background: white;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Cards */
    .cards {
        display: flex;
        gap: 20px;
        padding: 20px;
    }

    .card {
        flex: 1;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .number {
        font-size: 28px;
        font-weight: bold;
        color: #27ae60;

    }
</style>

<body>
    <h1>HELLO PAGE 1</h1>


    <script>

        /* Simple JS to simulate dashboard data */

        document.getElementById("users").innerText = 120;
        document.getElementById("orders").innerText = 75;
        document.getElementById("sales").innerText = "$1,540";

    </script>
</body>

</html>
